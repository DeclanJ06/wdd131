<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RecipeBook</title>
    <link rel="stylesheet" href="recipes.css" />
    <script defer src="recipes.js"></script>
    <meta name="description" content="Find delicious recipes including desserts, entrees, and more.">

    <!-- Open Graph (Facebook, LinkedIn, etc.) -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="RecipeBook">
    <meta property="og:description" content="Discover delicious recipes for every occasion.">
    <meta property="og:url" content="https://declanj06.github.io/recipes/">
    <meta property="og:image" content="images/social-preview-image.png">

    <!-- X Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="RecipeBook">
    <meta name="twitter:description" content="Discover delicious recipes for every occasion.">
    <meta name="twitter:image" content="images/social-preview-image.png">

    <!-- Icons -->
    <link rel="icon" href="favicon.ico">
    <link rel="apple-touch-icon" href="images/apple-touch-icon.png">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@700&display=swap" rel="stylesheet">
</head>
<body>

    <header>
        <div class="logo">
            <img src="recipe-book.png" alt="Recipe Book Logo">
            <h1>RecipeBook</h1>
        </div>
    </header>

    <main>

        <div class="search-container">
            <input type="text" placeholder="Find a recipe">
            <button>
                <img src="search.svg" alt="Search">
            </button>
        </div>

        <section class="recipe-card">

            <img class="recipe-image"
                 src="apple-crisp.jpg"
                 alt="Apple Crisp">

            <div class="recipe-info">

                <p class="tag">dessert</p>

                <h2>APPLE CRISP</h2>

                <span
                    class="rating"
                    role="img"
                    aria-label="Rating: 4 out of 5 stars"
                >
                    <span aria-hidden="true">⭐</span>
                    <span aria-hidden="true">⭐</span>
                    <span aria-hidden="true">⭐</span>
                    <span aria-hidden="true">⭐</span>
                    <span aria-hidden="true">☆</span>
                </span>

                <p class="description">
                    This apple crisp recipe is a simple yet delicious fall dessert
                    that's great served warm with vanilla ice cream.
                </p>

            </div>

        </section>

    </main>

    <footer>

        <a href="https://www.flaticon.com/free-icons/recipe" title="recipe icons"> Recipe icons created by Freepik - Flaticon </a>

        <div class="social">
            <!-- Social media icons provided under CC from https://www.iconfinder.com/AlfredoCreates -->
            <a href="#"><img src="instagram_icon.svg" alt="instagram icon"></a>
            <a href="#"><img src="youtube_icon.svg" alt="youtube icon"></a>
            <a href="#"><img src="pinterest_icon.svg" alt="pinterest icon"></a>
        </div>

    </footer>

</body>
</html>
